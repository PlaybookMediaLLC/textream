name: App Store Build Validation

# Manual CI validation for Dante for Creators (Playbook Interactive Media LLC).
# Upstream GitHub DMG / Homebrew Cask publishing was removed to prevent tags
# from ever interacting with upstream repositories.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS AppStore configuration (unsigned CI check)
        working-directory: Textream
        run: |
          xcodebuild build \
            -project Textream.xcodeproj \
            -scheme Textream \
            -configuration AppStore \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Run macOS unit tests
        working-directory: Textream
        run: |
          xcodebuild test \
            -project Textream.xcodeproj \
            -scheme Textream \
            -destination 'platform=macOS' \
            -only-testing:TextreamTests \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual

  validate-ios:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS AppStore configuration (unsigned CI check)
        working-directory: Textream
        run: |
          xcodebuild build \
            -project Textream.xcodeproj \
            -scheme TextreamiOS \
            -configuration AppStore \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Run iOS unit tests on Simulator
        working-directory: Textream
        run: |
          xcodebuild test \
            -project Textream.xcodeproj \
            -scheme TextreamiOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:TextreamiOSTests \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual
