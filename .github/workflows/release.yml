name: Release & Build Validation

# Builds, tests, packages downloadable macOS & iOS artifacts, and publishes
# semantic-release GitHub Releases on master for Dante for Creators
# (Playbook Interactive Media LLC).

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build, Test & Package macOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test release signing gates
        run: python3 -B -m unittest discover -s tests -p 'test_release_signing.py' -v

      - name: Configure required Developer ID signing & Apple notarization
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          umask 077
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "::error::Release requires MACOS_CERT_P12_BASE64 and MACOS_CERT_PASSWORD. See docs/MACOS_RELEASE_SIGNING.md."
            exit 1
          fi
          if ! { [ -n "$APPLE_NOTARY_KEY_BASE64" ] && [ -n "$APPLE_NOTARY_KEY_ID" ] && [ -n "$APPLE_NOTARY_ISSUER_ID" ]; } &&
             ! { [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; }; then
            echo "::error::Release requires complete Apple notarization credentials. See docs/MACOS_RELEASE_SIGNING.md."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/dante-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null

          IDENTITY="$MACOS_SIGNING_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -nE '/Developer ID Application:/s/.*"([^"]+)".*/\1/p' | head -n 1)"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 was provided but no Developer ID Application identity was found."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Found Developer ID signing identity: $IDENTITY"

          if [ -n "$APPLE_NOTARY_KEY_BASE64" ] && [ -n "$APPLE_NOTARY_KEY_ID" ] && [ -n "$APPLE_NOTARY_ISSUER_ID" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            {
              echo "APPLE_NOTARY_KEY_PATH=$KEY_PATH"
              echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
              echo "APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID"
            } >> "$GITHUB_ENV"
            echo "Configured Apple notarization via App Store Connect API key."
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_APP_PASSWORD=$APPLE_APP_PASSWORD"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID:-T44K9669GA}"
            } >> "$GITHUB_ENV"
            echo "Configured Apple notarization via Apple ID."
          fi

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Run macOS unit tests
        working-directory: Textream
        run: |
          xcodebuild test \
            -project Textream.xcodeproj \
            -scheme Textream \
            -destination 'platform=macOS' \
            -only-testing:TextreamTests \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual

      - name: Archive macOS AppStore configuration (unsigned CI archive)
        working-directory: Textream
        run: |
          mkdir -p build/ci
          xcodebuild archive \
            -project Textream.xcodeproj \
            -scheme Textream \
            -configuration AppStore \
            -destination 'generic/platform=macOS' \
            -archivePath build/ci/Dante-macOS-AppStore.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Build universal macOS app & DMG
        working-directory: Textream
        env:
          REQUIRE_NOTARIZATION: '1'
        run: ./build.sh

      - name: Clean up signing keychain & temporary keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dante-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Stage macOS release artifacts
        run: |
          mkdir -p release-artifacts
          cp Textream/build/release/Dante-for-Creators.dmg \
            release-artifacts/Dante-for-Creators-macOS-universal.dmg
          ditto -c -k --sequesterRsrc --keepParent \
            Textream/build/release/universal/Dante.app \
            release-artifacts/Dante-for-Creators-macOS-universal.app.zip
          ditto -c -k --sequesterRsrc --keepParent \
            Textream/build/ci/Dante-macOS-AppStore.xcarchive \
            release-artifacts/Dante-for-Creators-macOS-AppStore.xcarchive.zip
          ls -lh release-artifacts/

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  build-ios:
    name: Build, Test & Package iOS / iPadOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Xcode & Simulator info
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run iOS unit tests on Simulator
        working-directory: Textream
        run: |
          SIM_UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator found")
          # Prefer latest iOS runtime and Pro / standard iPhone models
          candidates.sort(key=lambda x: (x[0], "Pro" in x[1], x[1]), reverse=True)
          print(candidates[0][2])
          PY
          )
          echo "Using iOS Simulator UDID: $SIM_UDID"
          xcodebuild test \
            -project Textream.xcodeproj \
            -scheme TextreamiOS \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:TextreamiOSTests \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual

      - name: Archive iOS AppStore configuration (unsigned CI archive)
        working-directory: Textream
        run: |
          mkdir -p build/ci
          xcodebuild archive \
            -project Textream.xcodeproj \
            -scheme TextreamiOS \
            -configuration AppStore \
            -destination 'generic/platform=iOS' \
            -archivePath build/ci/Dante-iOS-AppStore.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Stage iOS release artifacts
        run: |
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            Textream/build/ci/Dante-iOS-AppStore.xcarchive \
            release-artifacts/Dante-for-Creators-iOS-AppStore.xcarchive.zip
          ls -lh release-artifacts/

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-ios]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-artifacts
          path: release-artifacts

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release-artifacts
          path: release-artifacts

      - name: Verify staged release artifacts
        run: ls -lh release-artifacts/

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/changelog@6 \
            -p @semantic-release/git@10 \
            semantic-release
