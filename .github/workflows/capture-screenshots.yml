name: Capture UI Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-screenshots:
    name: Capture macOS Dark & Light Screenshots
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render macOS Dark & Light studio screenshots
        working-directory: Textream
        env:
          TEST_RUNNER_DANTE_CAPTURE_SCREENSHOTS: "1"
        run: |
          OUT="${{ github.workspace }}/screenshots/macos"
          mkdir -p "$OUT"
          xcodebuild test \
            -project Textream.xcodeproj \
            -scheme Textream \
            -destination 'platform=macOS' \
            -only-testing:TextreamTests/DanteScreenshotCaptureTests \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual | tee /tmp/macos_shots.log
          SRC_DIR=$(grep -o 'DANTE_SCREENSHOT_DIR_OUT=.*' /tmp/macos_shots.log | tail -n 1 | cut -d= -f2-)
          if [ -n "$SRC_DIR" ] && [ -d "$SRC_DIR" ]; then
            cp "$SRC_DIR"/*.png "$OUT"/
          else
            find "$HOME/Library/Containers" /var/folders /tmp -name "macos-*.png" -exec cp {} "$OUT"/ \; 2>/dev/null || true
          fi
          ls -lh "$OUT"

      - name: Upload macOS screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dante-macos-screenshots
          path: screenshots/macos/*.png
          if-no-files-found: error

  ios-screenshots:
    name: Capture iOS Dark & Light Screenshots
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & capture iOS Simulator Dark & Light screenshots
        working-directory: Textream
        run: |
          OUT="${{ github.workspace }}/screenshots/ios"
          mkdir -p "$OUT"

          SIM_UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((runtime, d["name"], d["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator found")
          candidates.sort(key=lambda x: (x[0], "Pro" in x[1], x[1]), reverse=True)
          print(candidates[0][2])
          PY
          )
          echo "Using Simulator UDID: $SIM_UDID"

          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

          xcodebuild build \
            -project Textream.xcodeproj \
            -scheme TextreamiOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/sim \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual

          APP_PATH="build/sim/Build/Products/Debug-iphonesimulator/Dante.app"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          capture() {
            local file="$1"
            local appearance="$2"
            shift 2
            xcrun simctl terminate "$SIM_UDID" com.playbookinteractivemediallc.app || true
            xcrun simctl ui "$SIM_UDID" appearance "$appearance"
            xcrun simctl launch "$SIM_UDID" com.playbookinteractivemediallc.app "$@"
            sleep 2.5
            xcrun simctl io "$SIM_UDID" screenshot "$OUT/$file"
          }

          capture "ios-dark-home.png"     dark  -DanteThemeDark  -DanteSeedDemoScripts
          capture "ios-light-home.png"    light -DanteThemeLight -DanteSeedDemoScripts
          capture "ios-dark-library.png"  dark  -DanteThemeDark  -DanteSeedDemoScripts -DanteLibraryPreview
          capture "ios-light-library.png" light -DanteThemeLight -DanteSeedDemoScripts -DanteLibraryPreview
          capture "ios-dark-composer.png" dark  -DanteThemeDark  -DanteSeedDemoScripts -DanteQuickComposerPreview
          capture "ios-light-composer.png" light -DanteThemeLight -DanteSeedDemoScripts -DanteQuickComposerPreview

          ls -lh "$OUT"

      - name: Upload iOS screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dante-ios-screenshots
          path: screenshots/ios/*.png
          if-no-files-found: error
